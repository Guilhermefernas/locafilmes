server:
  port: 8080

spring:
  application:
    name: locafilmes-api

  datasource:
    url: jdbc:postgresql://localhost:5432/locafilmes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # o schema é criado/alterado via Flyway, nunca pelo Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # Em produção defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:locafilmes-chave-secreta-de-desenvolvimento-troque-em-producao-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hora

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.locafilmes: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
