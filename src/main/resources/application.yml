server:
  port: 8080

spring:
  application:
    name: locafilmes-api

  datasource:
    url: jdbc:postgresql://localhost:5432/locafilmes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # o schema é criado/alterado via Flyway, nunca pelo Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.locafilmes: INFO
    org.hibernate.SQL: DEBUG
